<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="VeloCare Tier 1 UI prototype — automated 5x sit-to-stand assessment for Taiwanese community elder-care centres. Simulated data."
    />
    <!-- All GENERATED from src/assets/mark.json by scripts/build-icons.mjs, the
         same file Logo.tsx imports — so the tab icon cannot drift away from the
         header mark. Bundled into dist/ and served same-origin, so the appliance
         still needs no network.

         `?v=` is a cache buster, and it is not decorative: a favicon is one of
         the most aggressively cached resources a browser has, and the previous
         mark persisted in tabs across reloads and a hard refresh. Bump it
         whenever the icons are regenerated. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=3" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png?v=3" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=3" />
    <title>VeloCare — 五次起立坐下量測</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
